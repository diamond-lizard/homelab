---
# Mounts step 6b: the refusals of the guest-bind ensure (a volume now on a
# configured target; a foreign mount the ledger cannot prove) and the guest
# lane at the observation site, with the helper's TRIPLE lines recorded so a
# legacy entry at a still-configured target is re-marked by this re-mount.
- name: Diagnose the empty guest share directories (read-only)
  ansible.builtin.include_tasks: _mounts_empty_share_diag.yml
  when: bind_mounts_guest_refused.empty_share | length > 0

- name: ACTION REQUIRED - guest share director(y/ies) empty
  vars:
    bind_mounts_box_lines: >-
      {%- set out = ['=' * 70] -%}
      {%- set _ = out.append('  Guest share director(y/ies) are empty, so the helper refused') -%}
      {%- set _ = out.append('  to bind them:') -%}
      {%- set _ = out.append('') -%}
      {%- set undetermined = [] -%}
      {%- for r in bind_mounts_empty_diag -%}
      {%- set rc = r.probe_rc | int(-1) -%}
      {%- set _ = out.append('  ' ~ r.machine ~ ':') -%}
      {%- set _ = out.append('      host source:   ' ~ r.src) -%}
      {%- set _ = out.append('      guest share:   ' ~ r.share) -%}
      {%- set _ = out.append('      guest target:  ' ~ r.target) -%}
      {%- set _ = out.append('      source files:  ' ~ ('none' if r.src_state == 'empty'
            else 'present' if r.src_state == 'content'
            else 'could not be read')) -%}
      {%- set _ = out.append('      host bind:     ' ~ ('in place' if rc == 0
            else 'created by this run' if rc == 10
            else 'not made: the playbook refused to bind the source' if rc in [3, 4]
            else 'unknown')) -%}
      {%- if r.verdict == 'source-empty' -%}
      {%- set _ = out.append('      cause:         the host source directory is empty.') -%}
      {%- set _ = out.append('      fix:           put content in it, or remove this mount from the') -%}
      {%- set _ = out.append('                     configuration.') -%}
      {%- elif r.verdict == 'host-bind-refused' -%}
      {%- set _ = out.append('      cause:         the share stays empty because the playbook refused to') -%}
      {%- set _ = out.append('                     bind the source. Its explanation:') -%}
      {%- for line in r.probe_lines -%}
      {%- set _ = out.append('                       ' ~ line) -%}
      {%- endfor -%}
      {%- set _ = out.append('      fix:           follow that explanation.') -%}
      {%- else -%}
      {%- set _ = out.append('      cause:         could not be determined from the host side.') -%}
      {%- set _ = undetermined.append(r.machine) -%}
      {%- endif -%}
      {%- set _ = out.append('') -%}
      {%- endfor -%}
      {%- if undetermined | length > 0 -%}
      {%- set _ = out.append('  Where the cause could not be determined: the host bind is') -%}
      {%- set _ = out.append('  missing, or the host source is an empty directory. Put content') -%}
      {%- set _ = out.append('  in an empty source or remove that mount from the configuration;') -%}
      {%- set _ = out.append('  otherwise converge the host binds (re-run the mounts') -%}
      {%- set _ = out.append('  phase; stop the machine first if a stale bind is involved).') -%}
      {%- endif -%}
      {%- set _ = out.append('  Then re-run the playbook with the same options.') -%}
      {%- set _ = out.append('  Nothing else was changed by this run.') -%}
      {%- set _ = out.append('=' * 70) -%}
      {{ out }}
  ansible.builtin.fail:
    msg: "{{ bind_mounts_box_lines | action_box }}"
  when: bind_mounts_guest_refused.empty_share | length > 0

- name: ACTION REQUIRED - guest bind target(s) carrying a machine volume
  vars:
    bind_mounts_box_lines:
      - "{{ '=' * 70 }}"
      - "{{ '%-70s' | format('  Guest bind target(s) carrying an smolvm volume:') }}"
      - "{{ '%-70s' | format('    ' ~ (bind_mounts_guest_refused.volume | map(attribute='machine') | join(', '))) }}"
      - "{{ '%-70s' | format('  The helper refused to bind over a volume, and this run did') }}"
      - "{{ '%-70s' | format('  not unmount anything inside the guest. Never umount these') }}"
      - "{{ '%-70s' | format('  targets inside the guest. Recovery, with the machine stopped:') }}"
      - "{{ '%-70s' | format('      smolvm machine stop --name <machine-name>') }}"
      - "{{ '%-70s' | format('      smolvm machine update --name <machine> --remove-volume=<src>:<tgt>') }}"
      - "{{ '%-70s' | format('  Nothing else was changed by this run.') }}"
      - "{{ '=' * 70 }}"
  ansible.builtin.fail:
    msg: "{{ bind_mounts_box_lines | action_box }}"
  when: bind_mounts_guest_refused.volume | length > 0

- name: ACTION REQUIRED - guest mount(s) the ledger cannot prove
  vars:
    bind_mounts_box_lines:
      - "{{ '=' * 70 }}"
      - "{{ '%-70s' | format('  Guest mount(s) the ledger cannot prove:') }}"
      - "{{ '%-70s' | format('    ' ~ (bind_mounts_guest_refused.unproven | map(attribute='machine') | join(', '))) }}"
      - "{{ '%-70s' | format('  Unmount each target in the guest, then re-run:') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('      smolvm machine exec --name <machine> -- umount <target>') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('  Nothing else was changed by this run.') }}"
      - "{{ '=' * 70 }}"
  ansible.builtin.fail:
    msg: "{{ bind_mounts_box_lines | action_box }}"
  when: bind_mounts_guest_refused.unproven | length > 0

- name: Collect the observed guest bind rows with their triples
  ansible.builtin.set_fact:
    bind_mounts_guest_payload: >-
      {%- set out = {} -%}
      {%- for r in (bind_mounts_guest_mount.results | default([])) -%}
      {%- if r.rc is defined and r.rc == 0 -%}
      {%- set how = 'mounted' if ('mounted:' in r.stdout or 'remounted:' in r.stdout)
            else 'matched' -%}
      {%- set row = {'target': r.bind_mounts_ensure_item.target, 'source': r.bind_mounts_ensure_item.share_path,
                     'observed': how} -%}
      {%- for line in r.stdout.splitlines() -%}
      {%- if line.startswith('TRIPLE fstype=') -%}
      {%- set _ = row.update({'triple': {'fstype': line.split()[1][7:],
            'source': line.split()[2][7:], 'root': line.split()[3][5:]}}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set _ = out.update({r.bind_mounts_ensure_item.machine:
            (out.get(r.bind_mounts_ensure_item.machine, []) or []) + [row]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {#- Lane truth follows observation (every examined running bind-mode
          machine gets its lane written, empty when it has no configured
          mounts): a zero-bind observation must overwrite ghost rows. -#}
      {%- for m in bind_mounts_running_bind -%}
      {%- set _ = out.setdefault(m.name, []) -%}
      {%- endfor -%}
      {{ out }}

- name: Write the observed guest bind lanes
  vars:
    bind_mounts_write_deltas: >-
      {%- set out = {} -%}
      {%- for bind_mounts_guest_row in (bind_mounts_guest_payload | default({})) | dict2items -%}
      {%- set _ = out.update({bind_mounts_guest_row.key: {'guest_binds': bind_mounts_guest_row.value}}) -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.include_tasks: _ledger_write.yml
