---
# Teardown step 2: unmount the configured and ledger-proven host binds of
# the not-running machines and prune the emptied share subdirectories.
# The share root itself is never removed (it holds the tree's other
# content). umount and rmdir run only when not in check mode; in check
# mode the refusals have already fired and no mutation happens.
- name: Unmount the host binds of the not-running machines
  ansible.builtin.command:
    argv: [umount, "{{ bind_mounts_teardown_bind.target }}"]
  become: true
  loop: "{{ bind_mounts_teardown_binds }}"
  loop_control:
    loop_var: bind_mounts_teardown_bind
    label: "{{ bind_mounts_teardown_bind.machine }}:{{ bind_mounts_teardown_bind.target }}"
  register: bind_mounts_teardown_umount
  changed_when: bind_mounts_teardown_umount.rc | default(1) | int == 0
  failed_when: false
  when: not ansible_check_mode

# The prune runs after every umount above: the mount table was not taken
# here, so a just-unmounted subdirectory is pruned in the same pass. A
# non-empty or busy directory fails harmlessly.
- name: Prune the emptied share subdirectories
  ansible.builtin.command:
    argv: [rmdir, "{{ bind_mounts_teardown_bind.target }}"]
  loop: "{{ bind_mounts_teardown_binds }}"
  loop_control:
    loop_var: bind_mounts_teardown_bind
    label: "{{ bind_mounts_teardown_bind.machine }}:{{ bind_mounts_teardown_bind.target }}"
  register: bind_mounts_teardown_prune
  failed_when: false
  changed_when: >-
    bind_mounts_teardown_prune.rc is defined and bind_mounts_teardown_prune.rc == 0
  when: not ansible_check_mode
