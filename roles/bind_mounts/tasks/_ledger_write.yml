---
# Shared per-lane ledger writer: merges only the examined machines'
# observed lanes into the working ledger and replaces the file atomically;
# everything else is kept verbatim, field- and machine-wise. A lane
# wrapper includes this file and sets bind_mounts_write_deltas: machine
# name -> dict of the lane fields observed for that machine (a lane field
# replaces that lane whole).
#
# Cumulation and merge-only semantics: each lane's merge starts from the
# registered snapshot below, never from the fact this file assigns
# (ansible-core 2.19+ stores set_fact values eagerly across same-run
# corrections), so the merge is a pure function of one eagerly evaluated
# register plus the lane's deltas; an examined machine absent from this
# lane's deltas passes through verbatim - a missing delta key must default
# to an empty merge, never a dropped machine.
#
# Writes are skipped in check mode, when the ledger is present but
# unreadable (bind_mounts_ledger_usable false), and when no examined lane
# survived the scope filter. New entries are seeded with the examined
# machine's registry mode; the top-level mode is recomputed as agree-only.
- name: Snapshot the working ledger this merge starts from
  ansible.builtin.debug:
    var: bind_mounts_ledger
  register: bind_mounts_write_base
  tags: [always]
# The optional bind_mounts_write_drop_machines (default []) names examined
# machines whose whole ledger entries are pruned from the working ledger
# instead of merged (the teardown phase); the merge's old-entries loop
# omits a dropped machine entirely (its entry does not survive the merge),
# a dropped machine's delta is ignored, and it is never seeded anew.

- name: Count the observed lanes inside the examined scope
  vars:
    bind_mounts_write_examined: "{{ bind_mounts_scoped_machines | map(attribute='name') | list }}"
  ansible.builtin.set_fact:
    bind_mounts_write_count: >-
      {{ ((bind_mounts_write_deltas | default({})) | dict2items
         | selectattr('key', 'in', bind_mounts_write_examined) | list | length)
         + (bind_mounts_write_drop_machines | default([])
         | select('in', bind_mounts_write_examined) | list | length) }}
  tags: [always]

- name: Merge the observed lanes into the working ledger
  when:
    - bind_mounts_ledger_usable | default(false) | bool
    - bind_mounts_write_count | int > 0
  vars:
    bind_mounts_write_examined: "{{ bind_mounts_scoped_machines | map(attribute='name') | list }}"
  ansible.builtin.set_fact:
    bind_mounts_ledger: >-
      {%- set scopes = bind_mounts_write_examined -%}
      {%- set deltas = bind_mounts_write_deltas | dict2items
           | selectattr('key', 'in', scopes) | list -%}
      {%- set reg_modes = bind_mounts_scoped_machines | items2dict(key_name='name', value_name='mode') -%}
      {%- set old = bind_mounts_write_base.bind_mounts_ledger.machines | default({}) -%}
      {%- set machines = {} -%}
      {%- for bind_mounts_entry in old | dict2items -%}
      {%- if bind_mounts_entry.key in (bind_mounts_write_drop_machines | default([])) -%}
      {%- elif bind_mounts_entry.key in scopes -%}
      {%- set _ = machines.update({bind_mounts_entry.key:
            bind_mounts_entry.value | combine(bind_mounts_write_deltas.get(bind_mounts_entry.key, {}))}) -%}
      {%- else -%}
      {%- set _ = machines.update({bind_mounts_entry.key: bind_mounts_entry.value}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for bind_mounts_delta in deltas -%}
      {%- if bind_mounts_delta.key not in machines
         and bind_mounts_delta.key not in (bind_mounts_write_drop_machines | default([])) -%}
      {%- set _ = machines.update({bind_mounts_delta.key:
            {'mode': reg_modes[bind_mounts_delta.key]} | combine(bind_mounts_delta.value)}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set agreed = machines.values() | map(attribute='mode', default=none) | reject('none') | unique | list -%}
      {%- set out = {'format': 1} -%}
      {%- if agreed | length == 1 -%}
      {%- set _ = out.update({'mode': agreed[0]}) -%}
      {%- endif -%}
      {%- set _ = out.update({'machines': machines}) -%}
      {{ out }}
  tags: [always]

- name: Render the merged ledger to the temp file
  ansible.builtin.copy:
    content: |
      # Managed by bind-mounts.yml (ansible). DO NOT EDIT; overwritten on re-run.
      #
      {{ bind_mounts_ledger | to_nice_yaml(indent=2) }}
    dest: "{{ bind_mounts_state_dir }}/{{ bind_mounts_ledger_file }}.tmp"
    mode: "0644"
  register: bind_mounts_write_render
  when:
    - not ansible_check_mode
    - bind_mounts_ledger_usable | default(false) | bool
    - bind_mounts_write_count | int > 0
  tags: [always]

- name: Install the rendered ledger into place (content-verified)
  ansible.builtin.include_tasks: _write_install.yml
  when: bind_mounts_write_render.changed | default(false) | bool
  tags: [always]
