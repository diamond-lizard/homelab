---
# Mounts step 4: the guest helper staged per run and preflighted before any
# guest mutation. Staging goes through the shared per-phase include: the
# mounts phase stages exactly the helper it executes (guest-mount-one.py).
# The preflight is the contract the parent guarantees, probed before the run
# touches the guest; one refusal names the machine and every miss. The
# probe and refusal live in the shared preflight file, applied also by the
# verify phase (a smaller tool set; see the prerequisite matrix).
- name: Preflight the guest tools and root exec on the running machines
  vars:
    bind_mounts_preflight_machines: "{{ bind_mounts_running_bind }}"
    bind_mounts_preflight_tools: [python3, findmnt, mount, umount, sh, mkdir, chown, chmod]
  ansible.builtin.include_tasks: _guest_preflight.yml

- name: Stage, transfer, and own the per-run helper copies
  vars:
    bind_mounts_stage_helper_name: guest-mount-one.py
    bind_mounts_stage_machines: "{{ bind_mounts_running_bind }}"
  ansible.builtin.include_tasks: _stage_helper.yml
