---
# Mounts step 8a (included first by _mounts_host_stale.yml, after the guest
# work): what the identity probe refused. A bind on a running machine that
# does not match its configured source refuses behind the stop-first box; an
# unproven stack refuses with the layered box naming the machine, the
# target, every layer, the exact force switch, and the manual umount
# command. The refusals mutate nothing themselves; the share tree, host
# binds and guest work of this phase have already executed, and the
# stopped-machine box (_mounts_stopped.yml) runs after this file.
- name: Collect the stale binds that need a stopped machine
  ansible.builtin.set_fact:
    bind_mounts_probe_stop: >-
      {{ bind_mounts_host_probe.results | default([])
         | selectattr('rc', 'defined') | selectattr('rc', 'eq', 4)
         | map(attribute='item') | list }}

- name: ACTION REQUIRED - stale mounts need a stopped machine
  vars:
    bind_mounts_box_lines:
      - "{{ '%-70s' | format('=' * 69) }}"
      - "{{ '%-70s' | format('  Machine(s) with a host bind that does not match its source:') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format(('    ' ~ (bind_mounts_probe_stop | map(attribute='machine') | unique | join(', ')))[:70]) }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('  The machine is running, so this run cannot replace the bind.') }}"
      - "{{ '%-70s' | format('  Stop each machine above:') }}"
      - "{{ '%-70s' | format('      smolvm machine stop --name <machine-name>') }}"
      - "{{ '%-70s' | format('  then run only the mounts selection with the same options') }}"
      - "{{ '%-70s' | format('  (a default run would start the machine again):') }}"
      - "{{ '%-70s' | format('      ansible-playbook playbooks/smolvm/profile.yml --tags mounts -K') }}"
      - "{{ '%-70s' | format('  If the ledger proves this playbook made the bind, that run') }}"
      - "{{ '%-70s' | format('  replaces it from the configured source, then ends on a box') }}"
      - "{{ '%-70s' | format('  saying guest binds need a running machine; that is expected.') }}"
      - "{{ '%-70s' | format('  Then run the default playbook to finish and verify. A bind the') }}"
      - "{{ '%-70s' | format('  ledger cannot prove is refused instead, and the box names the') }}"
      - "{{ '%-70s' | format('  force switch.') }}"
      - "{{ '%-70s' | format('  Earlier steps of this run may already have changed state.') }}"
      - "{{ '%-70s' | format('=' * 69) }}"
  ansible.builtin.fail:
    msg: "{{ bind_mounts_box_lines | action_box }}"
  when: bind_mounts_probe_stop | length > 0

- name: Collect the unproven stacks the probe refused
  ansible.builtin.set_fact:
    bind_mounts_probe_refused: >-
      {{ bind_mounts_host_probe.results | default([])
         | selectattr('rc', 'defined') | selectattr('rc', 'eq', 3)
         | map(attribute='item') | list }}

- name: Collect the allow prefixes the probe named
  ansible.builtin.set_fact:
    bind_mounts_probe_prefixes: >-
      {%- set out = [] -%}
      {%- for r in bind_mounts_host_probe.results | default([]) -%}
      {%- if r.rc | default(-1) | int == 3 -%}
      {%- for line in r.stdout_lines | default([]) -%}
      {%- if line.startswith('ALLOW-PREFIX: ') -%}
      {%- set _ = out.append(line[14:].strip()) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out | unique | list }}

- name: ACTION REQUIRED - stacked host binds this run will not change
  vars:
    bind_mounts_refused_box: >-
      {%- set out = ['=' * 69] -%}
      {%- set _ = out.append('  Stacked host bind(s) this run will not change:') -%}
      {%- set _ = out.append('') -%}
      {%- for r in bind_mounts_host_probe.results | default([]) -%}
      {%- if r.rc | default(-1) | int == 3 -%}
      {%- set _ = out.append('  ' ~ r.item.machine ~ ' (target ' ~ r.item.host_target ~ '):') -%}
      {%- for line in r.stdout_lines | default([]) -%}
      {%- if line.startswith('LAYER-SRC: ') -%}
      {%- set _ = out.append('      ' ~ line[11:]) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set _ = out.append('      manual command: sudo umount ' ~ r.item.host_target) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set _ = out.append('') -%}
      {%- set _ = out.append("  A layer marked (not ours) is not this role's own; accept it") -%}
      {%- set _ = out.append('  explicitly, then re-run with:') -%}
      {%- set _ = out.append('') -%}
      {%- set _ = out.append('      -e bind_mounts_force_remount=true') -%}
      {%- if bind_mounts_probe_prefixes | length > 0 -%}
      {%- set _ = out.append('      -e bind_mounts_force_allow_prefixes='
            ~ (bind_mounts_probe_prefixes | join(','))) -%}
      {%- endif -%}
      {%- set _ = out.append('') -%}
      {%- set _ = out.append('  Earlier steps of this run may already have changed state.') -%}
      {%- set _ = out.append('=' * 69) -%}
      {{ out }}
  ansible.builtin.fail:
    msg: "{{ bind_mounts_refused_box | action_box }}"
  when: bind_mounts_probe_refused | length > 0
