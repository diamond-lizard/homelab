---
# Mounts step 3d: the stacks the identity probe refused under a RUNNING
# machine (probe exit 5: more than one host layer at a share subdirectory
# whose top layer is the configured source). Raised right after the host
# apply file and before any guest work: the host binds, the readonly drift
# remounts and the host lane of this run are done by then (a refused target
# is excluded from the drift remount and the fresh bind by its exit code, and
# the lane carries its prior ledger row), and the guest identity refusal
# cannot pre-empt this box. Nothing here mutates anything. Check mode raises
# it too: the probe runs in check mode.
- name: Collect the host stacks the probe refused under running machines
  ansible.builtin.set_fact:
    bind_mounts_probe_stacked: >-
      {{ bind_mounts_host_probe.results | default([])
         | selectattr('rc', 'defined') | selectattr('rc', 'eq', 5)
         | map(attribute='item') | list }}

- name: ACTION REQUIRED - stacked host binds under a running machine
  vars:
    bind_mounts_stacked_box: >-
      {%- set out = ['=' * 70] -%}
      {%- set _ = out.append('  Stacked host bind(s) under a running machine:') -%}
      {%- set _ = out.append('') -%}
      {%- for r in bind_mounts_host_probe.results | default([]) -%}
      {%- if r.rc | default(-1) | int == 5 -%}
      {%- set _ = out.append('  ' ~ r.item.machine ~ ' (target ' ~ r.item.host_target ~ '):') -%}
      {%- for line in r.stdout_lines | default([]) -%}
      {%- if line.startswith('LAYER-SRC: ') -%}
      {%- set _ = out.append('      ' ~ line[11:]) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set _ = out.append('') -%}
      {%- set _ = out.append('  libkrun keeps the lower layer of a stack pinned while the machine') -%}
      {%- set _ = out.append('  runs, and the guest sees the old and the new layer side by side,') -%}
      {%- set _ = out.append('  so this run did not accept these binds and changed none of them.') -%}
      {%- set _ = out.append('  Stop each machine above:') -%}
      {%- set _ = out.append('') -%}
      {%- set _ = out.append('      smolvm machine stop --name <machine-name>') -%}
      {%- set _ = out.append('') -%}
      {%- set _ = out.append('  then run only the mounts selection with the same options (a') -%}
      {%- set _ = out.append('  default run would start the machine again):') -%}
      {%- set _ = out.append('') -%}
      {%- set _ = out.append('      ansible-playbook playbooks/smolvm/profile.yml --tags mounts -K') -%}
      {%- set _ = out.append('') -%}
      {%- set _ = out.append('  That run collapses a stack the ledger proves the playbook made and') -%}
      {%- set _ = out.append('  re-binds the configured source; it refuses a layer it cannot prove,') -%}
      {%- set _ = out.append('  and that box names the force switch. Then run the default playbook.') -%}
      {%- set _ = out.append('  The other host binds of this run are done; guest work was not') -%}
      {%- set _ = out.append('  started. Earlier steps of this run may already have changed state.') -%}
      {%- set _ = out.append('=' * 70) -%}
      {{ out }}
  ansible.builtin.fail:
    msg: "{{ bind_mounts_stacked_box | action_box }}"
  when: bind_mounts_probe_stacked | length > 0
