---
# Prelude step 9: the run lock. Skipped entirely in check mode. A watchdog
# holder keeps an exclusive non-blocking flock on run.lock and exits once the
# run's anchor playbook pid dies, so the kernel releases the lock in all exit
# paths; the anchor is discovered in the SYNCHRONOUS task below (the holder
# itself is detached, async/poll: 0). The anchor match tests every argv
# element's basename: on shebang console-script hosts the kernel execs python3
# with the playbook as argv[1], so argv0 alone never names ansible-playbook.

- name: Create the ledger state directory
  ansible.builtin.file:
    path: "{{ bind_mounts_state_dir }}"
    state: directory
    mode: "0700"

- name: Create a clean staging directory
  ansible.builtin.file:
    path: "{{ bind_mounts_state_dir }}/staging"
    state: directory
    mode: "0700"

- name: Draw this run's lock-holder token
  ansible.builtin.set_fact:
    bind_mounts_lock_token: "{{ 1000000000 | random }}"

- name: Remove holder sentinels whose run is no longer alive
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import glob, os, sys
        for pattern in ("run.*.holder", "run.anchor.*"):
            for sent in glob.glob(os.path.join(sys.argv[1], pattern)):
                try:
                    dead = not os.path.exists("/proc/%d" % int(open(sent).read().strip()))
                except (OSError, ValueError):
                    dead = True
                if dead: os.remove(sent)
      - "{{ bind_mounts_state_dir }}"
  changed_when: true

- name: Record the ansible run's anchor pid
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, sys
        def ppid(pid):
            return int(next(l.split()[1] for l in open("/proc/%d/status" % pid)
                            if l.startswith("PPid:")))
        def argvs(pid):
            try: return open("/proc/%d/cmdline" % pid, "rb").read().split(b"\0")
            except OSError: return []
        chain, cur = [os.getpid()], ppid(os.getpid())
        while cur > 1:
            chain.append(cur)
            if any(os.path.basename(a) == b"ansible-playbook" for a in argvs(cur)):
                with open(sys.argv[1], "w") as fh:
                    fh.write(str(cur))
                sys.exit(0)
            nxt = ppid(cur)
            if nxt >= cur: break
            cur = nxt
        sys.stderr.write("no ansible-playbook ancestor found; walked: "
                         + ", ".join("%d=%s" % (p, (os.path.basename(argvs(p)[0]) if argvs(p) else b"?").decode(errors="replace")) for p in chain) + "\n")
        sys.exit(5)
      - "{{ bind_mounts_state_dir }}/run.anchor.{{ bind_mounts_lock_token }}"
  changed_when: false

- name: Launch the lock watchdog holder
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import fcntl, json, os, sys, time
        lock_path, meta_path, sent_path, anchor_path = sys.argv[1:5]
        try:
            anchor = int(open(anchor_path).read().strip())
        except (OSError, ValueError):
            sys.exit(6)
        fd = os.open(lock_path, os.O_RDWR | os.O_CREAT, 0o600)
        try:
            fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
        except OSError:
            sys.exit(3)
        json.dump({"pid": anchor, "started-at": time.strftime("%Y-%m-%dT%H:%M:%S%z")}, open(meta_path, "w"))
        with open(sent_path, "w") as fh:
            fh.write(str(os.getpid()))
        while os.path.exists(sent_path) and os.path.exists("/proc/%d" % anchor):
            time.sleep(2)
      - "{{ bind_mounts_state_dir }}/run.lock"
      - "{{ bind_mounts_state_dir }}/run.json"
      - "{{ bind_mounts_state_dir }}/run.{{ bind_mounts_lock_token }}.holder"
      - "{{ bind_mounts_state_dir }}/run.anchor.{{ bind_mounts_lock_token }}"
  async: 3600
  poll: 0
  register: bind_mounts_lock_holder
