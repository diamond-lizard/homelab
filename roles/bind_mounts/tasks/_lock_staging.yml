---
# Prelude step 9: the run lock. Skipped entirely in check mode (the
# orchestrator gates this include). The lock is a single exclusive
# non-blocking flock held by a watchdog holder process that keeps the fd and
# exits on its own once the ansible-playbook run that launched it dies (found
# by walking the /proc parent chain), so the kernel releases the lock in all
# exit paths and there is no stale lock to break. Acquisition staging sweep:
# _staging_sweep.yml runs after this include.
- name: Create the ledger state directory
  ansible.builtin.file:
    path: "{{ bind_mounts_state_dir }}"
    state: directory
    mode: "0700"

- name: Create a clean staging directory
  ansible.builtin.file:
    path: "{{ bind_mounts_state_dir }}/staging"
    state: directory
    mode: "0700"

- name: Draw this run's lock-holder token
  ansible.builtin.set_fact:
    bind_mounts_lock_token: "{{ 1000000000 | random }}"

- name: Remove holder sentinels whose run is no longer alive
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import glob, os, sys
        for sent in glob.glob(os.path.join(sys.argv[1], "run.*.holder")):
            try:
                pid = int(open(sent).read().strip())
            except (OSError, ValueError):
                os.remove(sent)
                continue
            if not os.path.exists("/proc/%d" % pid):
                os.remove(sent)
      - "{{ bind_mounts_state_dir }}"
  changed_when: true

- name: Launch the lock watchdog holder
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import fcntl, json, os, sys, time
        lock_path, meta_path, sent_path = sys.argv[1], sys.argv[2], sys.argv[3]
        fd = os.open(lock_path, os.O_RDWR | os.O_CREAT, 0o600)
        try:
            fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
        except OSError:
            sys.exit(3)
        def ppid(pid):
            for line in open("/proc/%d/status" % pid):
                if line.startswith("PPid:"):
                    return int(line.split()[1])
            return 0
        def argv0(pid):
            try:
                return open("/proc/%d/cmdline" % pid, "rb").read().split(b"\0")[0].decode()
            except OSError:
                return ""
        anchor = os.getpid()
        cur = ppid(anchor)
        while cur > 1:
            anchor = cur
            if os.path.basename(argv0(cur)) == "ansible-playbook":
                break
            nxt = ppid(cur)
            if nxt >= cur:
                break
            cur = nxt
        with open(meta_path, "w") as fh:
            json.dump({"pid": anchor,
                       "started-at": time.strftime("%Y-%m-%dT%H:%M:%S%z")}, fh)
        with open(sent_path, "w") as fh:
            fh.write(str(os.getpid()))
        while os.path.exists(sent_path) and os.path.exists("/proc/%d" % anchor):
            time.sleep(2)
      - "{{ bind_mounts_state_dir }}/run.lock"
      - "{{ bind_mounts_state_dir }}/run.json"
      - "{{ bind_mounts_state_dir }}/run.{{ bind_mounts_lock_token }}.holder"
  async: 3600
  poll: 0
  register: bind_mounts_lock_holder
