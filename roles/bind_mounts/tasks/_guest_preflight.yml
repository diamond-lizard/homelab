---
# Shared guest-contract preflight, one file for every phase that probes the
# guest before its first mutation. The parent guarantees a handed-over
# machine's prerequisites; this file probes only what the calling phase
# needs, installs nothing, and refuses once per machine naming every
# missing item. Included with:
#   bind_mounts_preflight_machines - the running machines to probe
#   bind_mounts_preflight_tools    - the guest tool names the phase requires
# Root exec is probed for every machine the preflight covers. The probe is
# read-only, so it runs in check mode too (check mode is a converged-state
# verifier, not a preview); attach and teardown include this file for no
# machines (their work is host-side), so their phases preflight nothing.
#
# Probe rc taxonomy (pinned 2026-10-01 on the scratch machine): rc=0 with
# printed tool names is the missing-items refusal; rc!=0 with no names is
# an INDETERMINATE outcome - the guest exec channel itself failed, which
# is not a contract verdict - and refuses naming the machine, the raw rc,
# and the raw stderr; nothing is drawn from a failed exec.
- name: Probe the guest prerequisites the calling phase requires
  ansible.builtin.command:
    argv:
      - smolvm
      - machine
      - exec
      - --name
      - "{{ bind_mounts_preflight_machine.name }}"
      - --
      - sh
      - -c
      # One line per probe item: inside a folded scalar a MORE-INDENTED
      # line keeps its newline, and a shell line starting with '||' is a
      # syntax error (observed on the scratch machine); every probe line
      # stays at the same indent, one tool per line.
      - >-
        {%- for bind_mounts_preflight_tool in bind_mounts_preflight_tools -%}
        command -v {{ bind_mounts_preflight_tool }} >/dev/null 2>&1 || printf '%s\n' '{{ bind_mounts_preflight_tool }}';{%- endfor -%}
        [ "$(id -u)" = 0 ] || echo ROOT-EXEC
  loop: "{{ bind_mounts_preflight_machines }}"
  loop_control:
    loop_var: bind_mounts_preflight_machine
    label: "{{ bind_mounts_preflight_machine.name }}"
  register: bind_mounts_guest_preflight
  changed_when: false
  check_mode: false
  failed_when: false

- name: Refuse a machine whose guest contract is incomplete
  ansible.builtin.fail:
    msg: >-
      GUEST-CONTRACT-REFUSED: machine '{{ bind_mounts_stage_result.bind_mounts_preflight_machine.name }}'
      is missing the prerequisites this run needs inside the guest:
      {{ bind_mounts_stage_result.stdout_lines | join(', ') }}. The role never
      installs prerequisites and never trusts the image blindly; provision
      the machine with them first, then re-run. Nothing was changed.
  loop: "{{ (bind_mounts_guest_preflight.results | default([]))
         | selectattr('stdout', 'defined') | list }}"
  loop_control:
    loop_var: bind_mounts_stage_result
    label: "{{ bind_mounts_stage_result.bind_mounts_preflight_machine.name }}"
  when: (bind_mounts_stage_result.stdout | default('')) | trim | length > 0

- name: Refuse a machine whose guest contract could not be evaluated
  ansible.builtin.fail:
    msg: >-
      CONTRACT-EVAL-FAILED: the guest contract of machine
      '{{ bind_mounts_eval_result.bind_mounts_preflight_machine.name }}'
      could not be evaluated: the guest exec itself failed
      (rc {{ bind_mounts_eval_result.rc | default('?') }}, stderr:
      {{ bind_mounts_eval_result.stderr_lines | default([]) | join(' | ') }}).
      Check the machine's exec channel and state, then re-run; nothing was
      changed and no contract conclusion was drawn.
  loop: "{{ (bind_mounts_guest_preflight.results | default([]))
         | selectattr('stdout', 'defined') | list }}"
  loop_control:
    loop_var: bind_mounts_eval_result
    label: "{{ bind_mounts_eval_result.bind_mounts_preflight_machine.name }}"
  when:
    - (bind_mounts_eval_result.stdout | default('')) | trim | length == 0
    - (bind_mounts_eval_result.rc | default(0)) | int != 0
