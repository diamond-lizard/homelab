---
# Guest package installation: one pacman -S call per running machine,
# installing the configured alphabetical package list with --needed, so
# a re-run installs only what is missing. The package databases are never
# refreshed here (no -Sy: a refresh without an upgrade is a partial
# upgrade): each running guest is first checked read-only, and a missing
# database, a database ahead of the installed system or an untrustworthy
# check stops the run with a box naming the one pacman -Syu to run on
# purpose. In the default run this segment executes after the mounts phase
# (the ordering contract: volumes - start - mounts - software - verify).
# Guests must be running: a machine that is not running is skipped with a
# note, since packages install into the booted guest. The exec user is
# root by the guest contract, so no privilege escalation is involved here.
- name: Refresh the machine inventory for the software segment
  ansible.builtin.command: smolvm machine ls --verbose
  register: software_ls
  changed_when: false
  check_mode: false
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
  tags: [always]

- name: Parse the machine inventory for the software segment
  ansible.builtin.set_fact:
    software_sections: "{{ software_ls.stdout | smolvm_ls_sections }}"
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
  tags: [always]

# The guest's package state is checked read-only before anything is
# installed; check mode runs the checks too (only the install is skipped).
# One exec per running machine prints marker lines: SYNC-DB (are the sync
# databases present), PACMAN, QU-RC and QU-STDERR (exit status and stderr
# of pacman -Qu, which lists installed packages older than the databases)
# and one QU:<line> per such package. Any other shape is not trusted.
- name: Check the guest package state before installing
  ansible.builtin.command:
    argv:
      - smolvm
      - machine
      - exec
      - --name
      - "{{ m.name }}"
      - --
      - sh
      - -c
      - |
        p=missing
        for f in /var/lib/pacman/sync/*.db; do
          if [ -e "$f" ]; then p=present; break; fi
        done
        echo "SYNC-DB=$p"
        if ! command -v pacman >/dev/null 2>&1; then
          echo "PACMAN=missing"
          exit 0
        fi
        echo "PACMAN=present"
        e=$(mktemp) || { echo "TMP=failed"; exit 0; }
        out=$(pacman -Qu 2>"$e")
        rc=$?
        echo "QU-RC=$rc"
        if [ -s "$e" ]; then echo "QU-STDERR=yes"; else echo "QU-STDERR=no"; fi
        rm -f "$e"
        printf '%s\n' "$out" | while IFS= read -r l; do
          if [ -n "$l" ]; then echo "QU:$l"; fi
        done
  loop: "{{ config_machines }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  register: software_pacman_probe
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
    - software_sections[m.name].state == 'running'
  tags: [always]

# Category per machine, decided in this order: a probe that failed, lacks a
# marker or says pacman is missing is unknown; missing sync databases are
# missing (even when pacman also complained on stderr); an exit status other
# than 0 or 1, or anything on stderr, is unknown; any QU line means the
# databases are ahead of the installed system; otherwise consistent.
- name: Classify the guest package state
  ansible.builtin.set_fact:
    software_pacman_state: >-
      {%- set out = {} -%}
      {%- for r in software_pacman_probe.results | default([]) -%}
      {%- if not (r.skipped | default(false)) -%}
      {%- set lines = r.stdout_lines | default([]) -%}
      {%- set qu = lines | select('match', '^QU:') | map('regex_replace', '^QU:', '') | list -%}
      {%- if r.rc | default(1) != 0
             or ('SYNC-DB=present' not in lines and 'SYNC-DB=missing' not in lines)
             or 'PACMAN=present' not in lines -%}
      {%- set cat = 'unknown' -%}
      {%- elif 'SYNC-DB=missing' in lines -%}
      {%- set cat = 'missing' -%}
      {%- elif 'QU-STDERR=no' not in lines
               or ('QU-RC=0' not in lines and 'QU-RC=1' not in lines) -%}
      {%- set cat = 'unknown' -%}
      {%- elif qu | length > 0 -%}
      {%- set cat = 'ahead' -%}
      {%- else -%}
      {%- set cat = 'consistent' -%}
      {%- endif -%}
      {%- set _ = out.update({r.m.name: {'category': cat, 'updates': qu}}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
  tags: [always]

- name: ACTION REQUIRED - guest package state could not be checked
  vars:
    software_unchecked: >-
      {{ software_pacman_state | dict2items
         | selectattr('value.category', 'eq', 'unknown')
         | map(attribute='key') | list }}
    software_box_lines:
      - "{{ '%-70s' | format('=' * 69) }}"
      - "{{ '%-70s' | format('  Could not check the package state of:') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format(('    ' ~ (software_unchecked | join(', ')))[:70]) }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('  The software step checks the package databases before it') }}"
      - "{{ '%-70s' | format('  installs, and the check gave an answer it cannot trust (the') }}"
      - "{{ '%-70s' | format('  exec failed, pacman is missing, or pacman reported an error).') }}"
      - "{{ '%-70s' | format('  The software step installed nothing. Look at the guest:') }}"
      - "{{ '%-70s' | format('      smolvm machine exec --name <machine-name> -- pacman -Qu') }}"
      - "{{ '%-70s' | format('  then re-run with --tags software.') }}"
      - "{{ '%-70s' | format('=' * 69) }}"
  ansible.builtin.fail:
    msg: "{{ software_box_lines | action_box }}"
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
    - software_unchecked | length > 0
  tags: [always]

- name: ACTION REQUIRED - guest package databases are missing
  vars:
    software_nodb: >-
      {{ software_pacman_state | dict2items
         | selectattr('value.category', 'eq', 'missing')
         | map(attribute='key') | list }}
    software_box_lines:
      - "{{ '%-70s' | format('=' * 69) }}"
      - "{{ '%-70s' | format('  Machine(s) whose package databases are missing:') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format(('    ' ~ (software_nodb | join(', ')))[:70]) }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('  The install needs databases, and refreshing them alone (pacman') }}"
      - "{{ '%-70s' | format('  -Sy) risks a partial upgrade. Upgrade each guest once, on purpose:') }}"
      - "{{ '%-70s' | format('      smolvm machine exec --name <machine-name> -- pacman -Syu') }}"
      - "{{ '%-70s' | format('  then re-run. The software step installed nothing.') }}"
      - "{{ '%-70s' | format('=' * 69) }}"
  ansible.builtin.fail:
    msg: "{{ software_box_lines | action_box }}"
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
    - software_nodb | length > 0
  tags: [always]

- name: ACTION REQUIRED - guest package databases are ahead of the installed system
  vars:
    software_ahead: >-
      {{ software_pacman_state | dict2items
         | selectattr('value.category', 'eq', 'ahead')
         | map(attribute='key') | list }}
    software_box_lines:
      - "{{ '%-70s' | format('=' * 69) }}"
      - "{{ '%-70s' | format('  Machine(s) whose package databases are ahead of what is installed:') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format(('    ' ~ (software_ahead | join(', ')))[:70]) }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('  The databases were refreshed without an upgrade (for example by') }}"
      - "{{ '%-70s' | format('  pacman -Sy), so an install now would be a partial upgrade.') }}"
      - "{{ '%-70s' | format('  Upgrade each guest once, on purpose:') }}"
      - "{{ '%-70s' | format('      smolvm machine exec --name <machine-name> -- pacman -Syu') }}"
      - "{{ '%-70s' | format('  then re-run. The software step installed nothing.') }}"
      - "{{ '%-70s' | format('=' * 69) }}"
  ansible.builtin.fail:
    msg: "{{ software_box_lines | action_box }}"
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
    - software_ahead | length > 0
  tags: [always]

- name: Install the configured packages on running machines
  ansible.builtin.command:
    argv: "{{ ['smolvm', 'machine', 'exec', '--name', m.name, '--', 'pacman', '-S', '--needed', '--noconfirm'] + profile_packages }}"
  loop: "{{ config_machines }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  register: profile_pacman
  changed_when: "' there is nothing to do' not in profile_pacman.stdout"
  failed_when: profile_pacman.rc != 0
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
    - software_sections[m.name].state == 'running'
    - not ansible_check_mode
  tags: [always]

- name: Note machines skipped by the software segment
  ansible.builtin.debug:
    msg: >-
      Software skipped for {{ m.name }}: the machine is not running
      (state: {{ software_sections[m.name].state }}). Packages install
      into the booted guest; start it and re-run with --tags software.
  loop: "{{ config_machines }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length > 0
    - software_sections[m.name].state != 'running'
  tags: [always]

- name: Note an empty package list
  ansible.builtin.debug:
    msg: "packages is empty in the profile config; no guest software to install."
  when:
    - ansible_run_tags | intersect(['all', 'software']) | length > 0
    - profile_packages | length == 0
  tags: [always]
