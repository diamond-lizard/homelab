---
# TRANSITION, wrapper-owned (files deleted at the retirement gate). The
# lifecycle segment: the pending-volume-change refusals for the start and
# install selections (boxes and trigger conditions verbatim from the
# legacy play; stop has no pending-change gate today and gains none),
# then the start segment (exec-wait retries exactly as today: until rc
# == 0, retries 30, delay 2), then the stop segment (guest sync, then
# stop). The refusals compute from a FRESH `smolvm machine ls --verbose`
# parse taken inside this segment - never from the role invocation's
# registers or a pre-parse from the registry plumbing - plus a read-only
# ledger read for the provenance logic. The wrapper writes nothing to the
# ledger. The duplication of the volume-plan logic is the
# deliberate transition footprint, deleted at the
# gate.
- name: Collect a fresh machine inventory for the lifecycle decisions
  ansible.builtin.command: smolvm machine ls --verbose
  register: lifecycle_ls
  changed_when: false
  check_mode: false
  when: ansible_run_tags | intersect(['all', 'start', 'install', 'stop']) | length > 0
  tags: [always]

- name: Parse the fresh machine inventory
  ansible.builtin.set_fact:
    smolvm_sections: "{{ lifecycle_ls.stdout | smolvm_ls_sections }}"
  when: ansible_run_tags | intersect(['all', 'start', 'install', 'stop']) | length > 0
  tags: [always]

- name: Gate the fresh parse against the machine-state vocabulary
  ansible.builtin.set_fact:
    wrapper_state_gate: >-
      {{ smolvm_sections | smolvm_state_gate(
           (normalized | map(attribute='name') | list)
           + ((wrapper_ledger.machines | default({})) | dict2items | map(attribute='key') | list)) }}
  when: ansible_run_tags | intersect(['all', 'start', 'install', 'stop']) | length > 0
  tags: [always]

- name: Refuse a fresh state token outside the frozen vocabulary
  ansible.builtin.fail:
    msg: >-
      smolvm reports a state this run does not understand:
      {{ (wrapper_state_gate | dict2items
          | selectattr('value.classification', 'ne', 'running')
          | rejectattr('value.classification', 'eq', 'not-running')
          | map(attribute='value.message') | list | join(', ')) }}.
      Every lifecycle decision reads the machine state; anything outside
      the frozen vocabulary (running, stopped, created, failed,
      unreachable, frozen) cannot be decided safely. Bring the machine
      into a supported state before re-running.
  when: >-
    ansible_run_tags | intersect(['all', 'start', 'install', 'stop']) | length > 0
    and (wrapper_state_gate | dict2items
         | selectattr('value.classification', 'ne', 'running')
         | rejectattr('value.classification', 'eq', 'not-running')
         | list | length) > 0
  tags: [always]

- name: Compute the volume plan per machine for the pending-change refusals
  ansible.builtin.set_fact:
    volume_plans: >-
      {%- set result = {} -%}
      {%- for m in normalized -%}
      {%- set observed = smolvm_sections[m.name].mounts -%}
      {%- set observed_targets = observed | map(attribute='target') | list -%}
      {%- set entry = (wrapper_ledger.machines | default({})).get(m.name, {}) -%}
      {%- if m.mode == 'bind' -%}
      {%- set desired = [{'src': share_root_resolved, 'target': config.share_target, 'ro': false}] -%}
      {%- else -%}
      {%- set desired = [] -%}
      {%- for mnt in all_mounts | selectattr('machine', 'eq', m.name) -%}
      {%- set _ = desired.append({'src': mnt.src | realpath, 'target': mnt.target, 'ro': mnt.readonly}) -%}
      {%- endfor -%}
      {%- endif -%}
      {%- set desired_targets = desired | map(attribute='target') | list -%}
      {%- set managed = [] -%}
      {%- if entry.get('share_volume', false) -%}
      {%- set _ = managed.append({'src': share_root_resolved, 'target': config.share_target}) -%}
      {%- endif -%}
      {%- for v in entry.get('volumes', []) -%}
      {%- set _ = managed.append({'src': v.src, 'target': v.target}) -%}
      {%- endfor -%}
      {%- set stale_managed = managed | rejectattr('target', 'in', desired_targets) | list -%}
      {%- set stale_managed = stale_managed | selectattr('target', 'in', observed_targets) | list -%}
      {%- set stale_targets = stale_managed | map(attribute='target') | list -%}
      {%- set adds = [] -%}
      {%- set removes = [] -%}
      {%- set foreign = [] -%}
      {%- set refused_targets = [] -%}
      {%- set managed_resolved = [] -%}
      {%- for e in managed -%}
      {%- set _ = managed_resolved.append({'src': e.src | realpath, 'target': e.target}) -%}
      {%- endfor -%}
      {%- set force = bind_mounts_force_remount | default(false) | bool -%}
      {%- for v in desired -%}
      {%- set matching = observed | selectattr('target', 'eq', v.target) | first | default(none) -%}
      {%- if matching is none -%}
      {%- set spec = '--volume=' ~ v.src ~ ':' ~ v.target ~ (':ro' if v.ro else '') -%}
      {%- set _ = adds.append(spec) -%}
      {%- elif matching.src != v.src or matching.ro != v.ro -%}
      {%- set obs_resolved = matching.src | realpath -%}
      {%- set proven = (managed_resolved | selectattr('src', 'eq', obs_resolved) | selectattr('target', 'eq', matching.target) | list | length) > 0 -%}
      {%- if proven or force -%}
      {%- set spec = '--volume=' ~ v.src ~ ':' ~ v.target ~ (':ro' if v.ro else '') -%}
      {%- set _ = adds.append(spec) -%}
      {%- set _ = removes.append('--remove-volume=' ~ matching.src ~ ':' ~ matching.target) -%}
      {%- else -%}
      {%- set _ = foreign.append('%-70s' | format('    ' ~ m.name ~ ': ' ~ matching.target)) -%}
      {%- set _ = foreign.append('%-70s' | format('      observed:   ' ~ matching.src)) -%}
      {%- set _ = foreign.append('%-70s' | format('      configured: ' ~ v.src)) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for v in stale_managed -%}
      {%- set obs_at = observed | selectattr('target', 'eq', v.target) | first | default(none) -%}
      {%- set remove_src = obs_at.src if obs_at is not none else v.src -%}
      {%- set _ = removes.append('--remove-volume=' ~ remove_src ~ ':' ~ v.target) -%}
      {%- endfor -%}
      {%- set configured_targets = all_mounts | selectattr('machine', 'eq', m.name) | map(attribute='target') | list -%}
      {%- if wrapper_ledger_usable | bool -%}
      {%- for ov in observed -%}
      {%- set ov_proven = (managed_resolved | selectattr('src', 'eq', ov.src | realpath) | selectattr('target', 'eq', ov.target) | list | length) > 0 -%}
      {%- if ov.target in configured_targets and ov.target not in desired_targets and ov.target not in stale_targets and not ov_proven -%}
      {%- set _ = refused_targets.append(ov.target) -%}
      {%- if force -%}
      {%- set _ = removes.append('--remove-volume=' ~ ov.src ~ ':' ~ ov.target) -%}
      {%- else -%}
      {%- set _ = foreign.append('%-70s' | format(('    ' ~ m.name ~ ': ' ~ ov.target)[:70])) -%}
      {%- set _ = foreign.append('%-70s' | format(('      observed:   ' ~ ov.src)[:70])) -%}
      {%- set _ = foreign.append('%-70s' | format('      ledger:     no volume recorded at this target')) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- set external = observed | rejectattr('target', 'in', desired_targets + stale_targets + refused_targets) | list -%}
      {%- set _ = result.update({m.name: {
            'add': adds,
            'remove': removes,
            'external': external | length,
            'desired_count': desired | length,
            'foreign': foreign,
          }}) -%}
      {%- endfor -%}
      {{ result }}
  # check mode: the plan must still be computed - the pending-change refusals
  # are read-only verdicts and check mode is a converged-state verifier; the
  # inputs (lifecycle probe, registry, ledger) all carry check_mode: false
  # themselves. A `not ansible_check_mode` clause here left volume_plans
  # undefined for the default-selection consumers and crashed the check run
  # with 'volume_plans' is undefined (pinned 2026-10-03, 14:14 run).
  when:
    - ansible_run_tags | intersect(['all', 'start', 'install']) | length > 0
  tags: [always]

- name: Collect volumes at configured targets the ledger cannot prove
  ansible.builtin.set_fact:
    volume_plan_foreign: >-
      {{ volume_plans | dict2items | map(attribute='value.foreign') | flatten | list }}
  # no check-mode exclusion: the foreign-volume refusal is a read-only verdict
  # and must render in check mode (converged-state verifier contract)
  when:
    - ansible_run_tags | intersect(['all', 'start', 'install']) | length > 0
  tags: [always]

- name: >-
    ACTION REQUIRED: volume(s) at configured targets without ledger proof
  ansible.builtin.debug:
    msg: >-
      {{ ['=' * 70,
          '%-70s' | format('  Volume(s) at configured targets without ledger proof:'),
          '%-70s' | format('')]
         + volume_plan_foreign
         + ['%-70s' | format(''),
            '%-70s' | format('  The ledger does not prove this playbook created them. Volume'),
            '%-70s' | format('  changes need a stopped machine: stop the machine(s) above'),
            '%-70s' | format('  first, then re-run the default playbook (or --tags attach)'),
            '%-70s' | format('  with:'),
            '%-70s' | format(''),
            '%-70s' | format('      -e bind_mounts_force_remount=true'),
            '%-70s' | format(''),
            '%-70s' | format('  A forced volume is detached, and replaced where the'),
            '%-70s' | format('  configuration wants one. To deal with it yourself instead,'),
            '%-70s' | format('  stop the machine(s) and run:'),
            '%-70s' | format(''),
            '%-70s' | format('  smolvm machine update --name <machine> --remove-volume=<src>:<tgt>'),
            '%-70s' | format(''),
            '%-70s' | format('  Nothing else was changed by this run.'),
            '=' * 70] }}
  when:
    - ansible_run_tags | intersect(['all', 'start', 'install']) | length > 0
    - volume_plan_foreign | default([]) | length > 0
  tags: [always]

- name: Stop because a volume at a configured target is not proven ours
  ansible.builtin.fail:
    msg: "ACTION REQUIRED: volume(s) at configured targets need ledger proof; see the box above."
  when:
    - ansible_run_tags | intersect(['all', 'start', 'install']) | length > 0
    - volume_plan_foreign | default([]) | length > 0
  tags: [always]

- name: Collect running machines that need volume changes (default run)
  ansible.builtin.set_fact:
    volume_changes_blocked: "{{ volume_changes_blocked | default([]) + [m.name] }}"
  loop: "{{ normalized }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  when:
    - ansible_run_tags | intersect(['all', 'start', 'install']) | length > 0
    - (volume_plans[m.name].add + volume_plans[m.name].remove) | length > 0
    - smolvm_sections[m.name].state == 'running'
  tags: [always]

- name: >-
    ACTION REQUIRED: volume changes are pending on running machines
  ansible.builtin.debug:
    msg:
      - "{{ '=' * 70 }}"
      - "{{ '%-70s' | format('  ' ~ (volume_changes_blocked | length) ~ ' machine(s) running with pending volume changes:') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('    ' ~ (volume_changes_blocked | join(', '))) }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('  Volume changes require a stopped machine.') }}"
      - "{{ '%-70s' | format('  For each machine listed above, run:') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('      smolvm machine stop --name <machine-name>') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('  Then re-run the default playbook (no --tags): it applies the') }}"
      - "{{ '%-70s' | format('  volume changes, starts the machines, and finishes the rest.') }}"
      - "{{ '%-70s' | format('  For step-by-step control: --tags attach, then --tags start.') }}"
      - "{{ '%-70s' | format('') }}"
      - "{{ '%-70s' | format('  Nothing else was changed by this run.') }}"
      - "{{ '=' * 70 }}"
  when:
    - volume_changes_blocked | default([]) | length > 0
  tags: [always]

- name: Stop because volume changes are pending on running machines
  ansible.builtin.fail:
    msg: "ACTION REQUIRED: stop the machine(s) listed in the box above, then re-run the default playbook (no --tags)."
  when:
    - volume_changes_blocked | default([]) | length > 0
  tags: [always]

- name: Collect stopped machines whose volume changes this selection cannot apply
  ansible.builtin.set_fact:
    volume_changes_partial: "{{ volume_changes_partial | default([]) + [m.name] }}"
  loop: "{{ normalized }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  when:
    - ansible_run_tags | intersect(['start', 'install']) | length > 0
    - ansible_run_tags | intersect(['all', 'attach']) | length == 0
    - (volume_plans[m.name].add + volume_plans[m.name].remove) | length > 0
    - smolvm_sections[m.name].state != 'running'
  tags: [always]

- name: >-
    ACTION REQUIRED: volume changes are pending, but this selection does not apply them
  ansible.builtin.debug:
    msg: >-
      {{ ['=' * 70,
          '%-70s' | format('  Volume change(s) are pending on stopped machine(s):'),
          '%-70s' | format(''),
          '%-70s' | format(('    ' ~ (volume_changes_partial | join(', ')))[:70]),
          '%-70s' | format(''),
          '%-70s' | format('  This selection does not converge the volume set. Run the'),
          '%-70s' | format('  default playbook (no --tags): it applies the volume changes,'),
          '%-70s' | format('  starts the machines, and finishes the rest. Or converge with'),
          '%-70s' | format('  --tags attach, then start with --tags start.'),
          '%-70s' | format('')]
         + (['%-70s' | format('  Check mode: no volume change was applied or would be.')]
            if ansible_check_mode
            else ['%-70s' | format('  Nothing else was changed by this run.')])
         + ['=' * 70] }}
  when:
    - volume_changes_partial | default([]) | length > 0
  tags: [always]

- name: Stop because this selection cannot converge pending volume changes
  ansible.builtin.fail:
    msg: "ACTION REQUIRED: volume changes are pending and --tags {{ ansible_run_tags | join(',') }} does not apply them; see the box above."
  # no check-mode exclusion: refusals render in check mode (converged-state
  # verifier contract); only genuinely mutating tasks are excluded
  when:
    - volume_changes_partial | default([]) | length > 0
  tags: [always]

- name: Start machines that are stopped
  ansible.builtin.command: "smolvm machine start --name {{ m.name }}"
  loop: "{{ normalized }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  register: machine_start
  changed_when: "'running (PID' in machine_start.stdout"
  when:
    - ansible_run_tags | intersect(['all', 'start']) | length > 0
    - smolvm_sections[m.name].state != 'running'
    - not ansible_check_mode
  tags: [always]

- name: Compute machines started by this run
  ansible.builtin.set_fact:
    started_machines: >-
      {{ machine_start.results | default([])
         | selectattr('changed', 'defined') | selectattr('changed')
         | map(attribute='m.name') | list }}
  when: ansible_run_tags | intersect(['all', 'start']) | length > 0
  tags: [always]

- name: Wait for started machines to accept exec
  ansible.builtin.command: "smolvm machine exec --name {{ item }} -- id -u"
  loop: "{{ started_machines }}"
  register: exec_probe
  until: exec_probe.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  when: ansible_run_tags | intersect(['all', 'start']) | length > 0
  tags: [always]

- name: Refresh the machine inventory after starting
  ansible.builtin.command: smolvm machine ls --verbose
  register: smolvm_ls
  changed_when: false
  check_mode: false
  when:
    - ansible_run_tags | intersect(['all', 'start']) | length > 0
    - started_machines | length > 0
  tags: [always]

- name: Re-parse the machine inventory after starting
  ansible.builtin.set_fact:
    smolvm_sections: "{{ smolvm_ls.stdout | smolvm_ls_sections }}"
  when:
    - ansible_run_tags | intersect(['all', 'start']) | length > 0
    - started_machines | length > 0
  tags: [always]

- name: Sync guest filesystems before stopping
  ansible.builtin.command:
    argv:
      - smolvm
      - machine
      - exec
      - --name
      - "{{ m.name }}"
      - --
      - sync
  loop: "{{ normalized }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  failed_when: false
  changed_when: false
  when:
    - ansible_run_tags | intersect(['stop']) | length > 0
    - smolvm_sections[m.name].state == 'running'
    - not ansible_check_mode
  tags: [always]

- name: Stop running machines
  ansible.builtin.command: "smolvm machine stop --name {{ m.name }}"
  loop: "{{ normalized }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  register: machine_stop
  changed_when: "'Stopped machine' in machine_stop.stdout"
  when:
    - ansible_run_tags | intersect(['stop']) | length > 0
    - smolvm_sections[m.name].state == 'running'
    - not ansible_check_mode
  tags: [always]
