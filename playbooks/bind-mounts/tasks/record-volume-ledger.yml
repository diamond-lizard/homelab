---
# Records the volume half of the provenance ledger at the volume apply sites,
# so a run that changes a machine's volume set and then fails before the final
# ledger write still leaves the ledger describing the volumes attached now.
# Included with:
#
#   volume_apply_results  register of the apply task (a loop result)
#   volume_record_mode    converge   - the apply made the machine match the
#                                      configuration
#                         torn-down  - teardown removed the ledger's volumes
#
# The write merges only the share_volume/volumes fields of the machines whose
# update returned 0; every other field and every other machine is preserved,
# and the file keeps the header, mode and atomic replacement the final writer
# uses. A ledger that is present but unreadable is not replaced: its warning
# and its disabled cleanup stay in force.
#
# Every task carries tags: [always] because tags do not propagate into a
# dynamically included file: without it, --tags attach and --tags teardown
# would run the include and skip every task in it, silently.
#
# The apply tasks set loop_control.loop_var, so a per-item result holds the
# machine under that name (r.m) rather than under r.item; the loop variable is
# read from the result's own ansible_loop_var key.
- name: Collect the volume updates that succeeded
  ansible.builtin.set_fact:
    volume_record_machines: >-
      {%- set out = {} -%}
      {%- for r in (volume_apply_results | default({})).results | default([]) -%}
      {%- set rec = r[r.ansible_loop_var | default('item')] | default({}) -%}
      {%- if rec.name is defined and not (r.skipped | default(false)) and (r.rc | default(1) | int == 0) -%}
      {%- if volume_record_mode == 'torn-down' -%}
      {%- set fields = {'share_volume': false, 'volumes': []} -%}
      {%- else -%}
      {%- set volumes = [] -%}
      {%- for mnt in all_mounts | selectattr('machine', 'eq', rec.name) -%}
      {%- set _ = volumes.append({'src': mnt.src | realpath, 'target': mnt.target, 'readonly': mnt.readonly}) -%}
      {%- endfor -%}
      {%- set fields = {'share_volume': config.mode == 'bind',
                        'volumes': volumes if config.mode == 'direct' else []} -%}
      {%- endif -%}
      {%- set entry = (ledger.machines | default({})).get(rec.name, {}) -%}
      {%- set _ = out.update({rec.name: entry | combine(fields)}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  tags: [always]

- name: Merge the recorded volumes into the in-memory ledger
  ansible.builtin.set_fact:
    ledger: >-
      {{ {'format': 1, 'mode': ledger.mode | default(config.mode),
          'machines': (ledger.machines | default({})) | combine(volume_record_machines)} }}
  when: volume_record_machines | length > 0
  tags: [always]

- name: Record the volumes this run changed in the provenance ledger
  ansible.builtin.copy:
    content: |
      # Managed by bind-mounts.yml (ansible). DO NOT EDIT; overwritten on re-run.
      #
      {{ ledger | to_nice_yaml(indent=2) }}
    dest: "{{ bind_mounts_state_dir }}/{{ ledger_file_name }}"
    mode: "0644"
  when:
    - not ansible_check_mode
    - volume_record_machines | length > 0
    - ledger_text | length == 0 or ledger_usable
  tags: [always]

- name: Collect volume updates that failed
  ansible.builtin.set_fact:
    volume_record_failed: >-
      {%- set out = [] -%}
      {%- for r in (volume_apply_results | default({})).results | default([]) -%}
      {%- set rec = r[r.ansible_loop_var | default('item')] | default({}) -%}
      {%- if not (r.skipped | default(false)) and (r.rc is not defined or r.rc | int != 0) -%}
      {%- set name = rec.name | default('(unknown machine)') -%}
      {%- set detail = (r.stderr | default(r.msg | default('(no message)'))) | trim | replace('\n', ' ') -%}
      {%- set _ = out.append('%-70s' | format(('  ' ~ name ~ ': update failed, rc ' ~ (r.rc | default('none')))[:70])) -%}
      {%- for line in (detail | wordwrap(64, true, '\n')).split('\n') -%}
      {%- set _ = out.append('%-70s' | format(('    ' ~ line)[:70])) -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  tags: [always]

- name: >-
    ACTION REQUIRED: volume update(s) failed
  ansible.builtin.debug:
    msg: >-
      {{ ['=' * 70,
          '%-70s' | format('  Machine(s) whose volume update failed:'),
          '%-70s' | format('')]
         + volume_record_failed
         + (['%-70s' | format(''),
             '%-70s' | format('  The machines that succeeded are recorded in the ledger; the'),
             '%-70s' | format('  ones above were left as they were. Fix the error, then re-run:'),
             '%-70s' | format('  the plan is computed from the volumes each machine has now.'),
             '%-70s' | format('  If a later run then asks to remove a volume that is already'),
             '%-70s' | format('  gone, delete the ledger and re-run: deleting it loses only the'),
             '%-70s' | format('  cleanup bookkeeping, and the volumes each machine has now are'),
             '%-70s' | format('  adopted again.')]
            if (ledger_text | length == 0 or ledger_usable)
            else ['%-70s' | format(''),
                  '%-70s' | format('  No record was written: the ledger is present but'),
                  '%-70s' | format('  unreadable. Fix or delete it, then re-run.')])
         + ['%-70s' | format(''),
            '=' * 70] }}
  when: volume_record_failed | default([]) | length > 0
  tags: [always]

- name: Stop because a volume update failed
  ansible.builtin.fail:
    msg: "ACTION REQUIRED: a volume update failed; see the box above."
  when: volume_record_failed | default([]) | length > 0
  tags: [always]
