---
# TRANSITION REGISTRY PLUMBING (wrapper-owned; deleted at the retirement
# gate). The include_vars precedence trap is
# handled exactly once, here: vars.yml loads into the private dict
# `config`, which never becomes a role variable, and is translated into
# the per-machine role registry per the machine registry shape - the legacy global
# mode and share fields are copied into every machine entry; direct-mode
# machines get no share fields. The wrapper performs no ledger writes
# anywhere: the ledger, the host mount table, the smolvm
# inventory, and the machine-state vocabulary gate are read-only here.
# The legacy validation messages and the share-tree placeholder creation
# (always-tagged, as today) stay verbatim.
- name: Check that vars.yml exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/vars.yml"
  register: config_file
  tags: [always]

- name: Require vars.yml
  ansible.builtin.fail:
    msg: >-
      vars.yml was not found next to the playbook. Copy vars.yml.example to
      vars.yml, fill in your machine names, users, and mounts, then re-run.
  when: not config_file.stat.exists
  tags: [always]

- name: Load config from vars.yml
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/vars.yml"
    name: config
  tags: [always]

- name: Assert top-level config validity
  ansible.builtin.assert:
    that:
      - config.mode is defined
      - config.mode in ['bind', 'direct']
      - config.machines is defined
      - config.machines | length > 0
      - config.share_root is defined
      - config.share_root is match('/')
      - config.share_root is not search('\\s')
      - config.share_target is defined
      - config.share_target is match('/')
      - config.share_target is not search('\\s')
    msg: >-
      Invalid configuration: mode must be 'bind' or 'direct', machines must
      be a non-empty list, and share_root / share_target must be absolute
      paths without whitespace.
  tags: [always]

- name: Assert the ledger state directory is absolute and outside the share
  ansible.builtin.assert:
    that:
      - bind_mounts_state_dir is match('/')
      - bind_mounts_state_dir is not search('\\s')
      - not (bind_mounts_state_dir ~ '/') is match(config.share_root | realpath ~ '/')
    msg: >-
      Invalid configuration: bind_mounts_state_dir must be an absolute path
      without whitespace and must not sit inside share_root - the ledger is
      host-only by decision, and share_root is attached to guests in bind
      mode.
  tags: [always]

- name: Assert guest artifact paths are absolute and whitespace-free
  ansible.builtin.assert:
    that:
      - installed_script_guest_path is match('/')
      - installed_script_guest_path is not search('\\s')
      - sudoers_dropin_guest_path is match('/')
      - sudoers_dropin_guest_path is not search('\\s')
      - sudoers_dropin_guest_path | basename | length > 0
      - sudoers_staging_guest_path is match('/')
      - sudoers_staging_guest_path is not search('\\s')
      - sudoers_staging_guest_path != sudoers_dropin_guest_path
      - helper_dir_guest_path is match('/')
      - helper_dir_guest_path is not search('\\s')
      - helper_dir_guest_path | basename | length > 0
    msg: >-
      installed_script_guest_path and sudoers_dropin_guest_path must be
      absolute paths without whitespace, ending in a file name; the guest
      staging path must be absolute, whitespace-free, and different from
      the drop-in destination; the helper directory must be an absolute,
      whitespace-free path with a file name as its last segment.
  tags: [always]

- name: Normalize limit_machines
  ansible.builtin.set_fact:
    limit_parts: "{{ limit_machines | default('') | string | split(',') | map('trim') | reject('equalto', '') | list }}"
  tags: [always]

- name: Fail when limit_machines names an unknown machine
  ansible.builtin.assert:
    that:
      - limit_parts | difference(config.machines | map(attribute='name') | list) | length == 0
    msg: >-
      limit_machines contains a machine name that is not in vars.yml.
      Configured machines: {{ config.machines | map(attribute='name') | list | join(', ') }}.
  tags: [always]

- name: Apply machine scoping (limit_machines)
  ansible.builtin.set_fact:
    config_machines: >-
      {{ config.machines
         | selectattr('name', 'in', limit_parts)
         | list if limit_parts | length > 0
         else config.machines }}
  tags: [always]

- name: Resolve the share root to its canonical host path
  ansible.builtin.set_fact:
    share_root_resolved: "{{ config.share_root | realpath }}"
  tags: [always]

- name: Build the normalized machine and mount list
  ansible.builtin.set_fact:
    # Legacy-shaped normalized list (the wrapper's own loops keep today's
    # shapes) plus the per-machine role registry per the machine registry shape:
    # mode/share_root/share_target are copied from the legacy global config
    # into every machine entry; direct-mode machines get no share fields.
    normalized: >-
      {%- set out = [] -%}
      {%- for m in config_machines -%}
      {%- set mounts = [] -%}
      {%- for mnt in m.mounts | default([]) -%}
      {%- set share_name = mnt.name | default(mnt.src | basename) -%}
      {%- set _ = mounts.append({
            'machine': m.name,
            'user': m.user,
            'name': share_name,
            'src': mnt.src,
            'target': mnt.target,
            'readonly': mnt.readonly | default(false) | bool,
            'uid_eff': mnt.uid | default(m.uid),
            'gid_eff': mnt.gid | default(m.gid),
            'share_path': config.share_target ~ '/' ~ share_name,
          }) -%}
      {%- endfor -%}
      {%- set _ = out.append({
            'name': m.name,
            'user': m.user,
            'uid': m.uid,
            'gid': m.gid,
            'mode': config.mode,
            'profile_path': m.profile_path | default('/home/' ~ m.user ~ '/.bash_profile'),
            'max_volumes': m.max_volumes | default(4),
            'mounts': mounts | sort(attribute='target'),
          }) -%}
      {%- endfor -%}
      {{ out }}
    registry: >-
      {%- set out = [] -%}
      {%- for m in config_machines -%}
      {%- set entry = {
            'name': m.name,
            'user': m.user,
            'uid': m.uid,
            'gid': m.gid,
            'mode': config.mode,
            'profile_path': m.profile_path | default('/home/' ~ m.user ~ '/.bash_profile'),
            'max_volumes': m.max_volumes | default(4)} -%}
      {%- if config.mode == 'bind' -%}
      {%- set _ = entry.update({'share_root': share_root_resolved,
                                'share_target': config.share_target}) -%}
      {%- endif -%}
      {%- set mnts = [] -%}
      {%- for mnt in m.mounts | default([]) -%}
      {%- set mnt_entry = {
            'src': mnt.src,
            'target': mnt.target,
            'name': mnt.name | default(mnt.src | basename),
            'readonly': mnt.readonly | default(false) | bool} -%}
      {%- if mnt.uid is defined -%}{%- set _ = mnt_entry.update({'uid': mnt.uid}) -%}{%- endif -%}
      {%- if mnt.gid is defined -%}{%- set _ = mnt_entry.update({'gid': mnt.gid}) -%}{%- endif -%}
      {%- set _ = mnts.append(mnt_entry) -%}
      {%- endfor -%}
      {%- set _ = entry.update({'mounts': mnts}) -%}
      {%- set _ = out.append(entry) -%}
      {%- endfor -%}
      {{ out }}
  tags: [always]

- name: Show the assembled registry
  ansible.builtin.debug:
    msg: "{{ registry }}"
  tags: [always]

- name: Expose the role variable pass-through for the role invocations
  ansible.builtin.set_fact:
    bind_mounts_machines: "{{ registry }}"
    bind_mounts_limit_machines: "{{ limit_parts }}"
    bind_mounts_force_remount: "{{ bind_mounts_force_remount | default(false) | bool }}"
    bind_mounts_force_allow_prefixes: "{{ bind_mounts_force_allow_prefixes | default([], true) }}"
  tags: [always]

- name: Flatten mounts for host-side loops
  ansible.builtin.set_fact:
    all_mounts: "{{ normalized | map(attribute='mounts') | flatten }}"
  tags: [always]

- name: Assert machine names are unique
  ansible.builtin.assert:
    that:
      - normalized | map(attribute='name') | list | length ==
        (normalized | map(attribute='name') | unique | list | length)
    msg: "Machine names in vars.yml must be unique."
  tags: [always]

- name: Assert absolute whitespace-free mount paths
  vars:
    all_paths: "{{ (all_mounts | map(attribute='src') | list)
                   + (all_mounts | map(attribute='target') | list) }}"
  ansible.builtin.assert:
    that:
      - all_paths | select('match', '/') | list | length == all_paths | length
      - all_paths | reject('search', '\\s') | list | length == all_paths | length
    msg: >-
      Every mount src and target must be an absolute path without
      whitespace.
  tags: [always]

- name: Assert guest targets are unique per machine
  ansible.builtin.assert:
    that:
      - m.mounts | map(attribute='target') | list | length ==
        (m.mounts | map(attribute='target') | unique | list | length)
    msg: "Machine {{ m.name }} has duplicate guest targets."
  loop: "{{ normalized }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  tags: [always]

- name: Assert one share name per source directory
  vars:
    src_name_pairs: "{{ all_mounts | map(attribute='src') | zip(all_mounts | map(attribute='name')) }}"
    name_src_pairs: "{{ all_mounts | map(attribute='name') | zip(all_mounts | map(attribute='src')) }}"
  ansible.builtin.assert:
    that:
      - dict(src_name_pairs) | length == (src_name_pairs | unique | list | length)
      - dict(name_src_pairs) | length == (name_src_pairs | unique | list | length)
    msg: >-
      Share names must map one-to-one to source directories: the same src
      under two different names, or one name on two different srcs, is
      rejected. (The same name+src pair on several machines is fine - those
      machines share the subdirectory.)
  tags: [always]

- name: Verify every source exists and is a directory on the host
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ all_mounts | map(attribute='src') | unique | list }}"
  register: src_stats
  tags: [always]

- name: Fail on missing or non-directory sources
  ansible.builtin.assert:
    that:
      - src_stats.results[ansible_loop.index0].stat.exists
      - src_stats.results[ansible_loop.index0].stat.isdir
    fail_msg: "Source directory problem for {{ item }}: it must exist and be a directory on the host."
  loop: "{{ all_mounts | map(attribute='src') | unique | list }}"
  loop_control:
    extended: true
    label: "{{ item }}"
  tags: [always]

- name: Collect the host mount table
  ansible.builtin.command: findmnt -rn -o TARGET,SOURCE,FSTYPE
  register: host_findmnt
  changed_when: false
  check_mode: false
  tags: [always]

- name: Parse the host mount table
  ansible.builtin.set_fact:
    host_mounts: >-
      {%- set result = {} -%}
      {%- for line in host_findmnt.stdout_lines -%}
      {%- set parts = line.split() -%}
      {%- if parts | length == 3 -%}
      {%- set _ = result.update({parts[0]: {'source': parts[1], 'fstype': parts[2]}}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ result }}
  tags: [always]

- name: Collect the smolvm machine inventory
  ansible.builtin.command: smolvm machine ls --verbose
  register: smolvm_ls
  changed_when: false
  check_mode: false
  tags: [always]

- name: Parse the smolvm machine inventory
  ansible.builtin.set_fact:
    smolvm_sections: "{{ smolvm_ls.stdout | smolvm_ls_sections }}"
  tags: [always]

- name: Fail on configured machines missing from smolvm
  ansible.builtin.assert:
    that: m.name in smolvm_sections
    msg: >-
      Machine '{{ m.name }}' was not found in smolvm machine ls output.
      Check for a typo in vars.yml, or create the machine first.
  loop: "{{ normalized }}"
  loop_control:
    loop_var: m
    label: "{{ m.name }}"
  tags: [always]

- name: Inspect the share root
  ansible.builtin.stat:
    path: "{{ share_root_resolved }}"
  register: share_root_stat
  tags: [always]

- name: Reject a share root that exists as a non-directory
  ansible.builtin.assert:
    that: not share_root_stat.stat.exists or share_root_stat.stat.isdir
    msg: "share_root {{ config.share_root }} exists but is not a directory."
  tags: [always]

- name: Create the share root
  ansible.builtin.file:
    path: "{{ share_root_resolved }}"
    state: directory
    mode: "0755"
  become: true
  when: not ansible_check_mode
  tags: [always]

- name: Create per-mount share subdirectories (bind mode)
  ansible.builtin.file:
    path: "{{ share_root_resolved ~ '/' ~ item.name }}"
    state: directory
    mode: "0755"
  become: true
  loop: "{{ all_mounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - config.mode == 'bind'
    - not ansible_check_mode
  tags: [always]

- name: Create the ledger state directory
  ansible.builtin.file:
    path: "{{ bind_mounts_state_dir }}"
    state: directory
    mode: "0700"
  when: not ansible_check_mode
  tags: [always]

# The ledger read mirrors the role's semantic (roles/bind_mounts/tasks/
# _ledger_read.yml): a MISSING ledger file is an empty new ledger (usable,
# no warning); a present-but-unreadable one is flagged unusable and warns.
# The role re-reads the ledger itself from bind_mounts_state_dir; these
# wrapper facts govern only the wrapper's own decisions.
- name: Probe the provenance ledger file
  ansible.builtin.stat:
    path: "{{ bind_mounts_state_dir }}/{{ ledger_file_name }}"
  register: wrapper_ledger_stat
  tags: [always]

- name: Read the provenance ledger bytes
  ansible.builtin.slurp:
    src: "{{ bind_mounts_state_dir }}/{{ ledger_file_name }}"
  register: wrapper_ledger_raw
  failed_when: false
  when: wrapper_ledger_stat.stat.exists
  tags: [always]

- name: Normalize the provenance ledger
  vars:
    wrapper_ledger_text: >-
      {{ (wrapper_ledger_raw.content | b64decode)
         if wrapper_ledger_stat.stat.exists
            and not (wrapper_ledger_raw.failed | default(false))
            and wrapper_ledger_raw.content is defined
         else '' }}
    wrapper_ledger_parsed: "{{ wrapper_ledger_text | from_yaml if wrapper_ledger_text | length > 0 else {'format': 1, 'machines': {}} }}"
    wrapper_ledger_usable_calc: "{{ (not wrapper_ledger_stat.stat.exists) or (wrapper_ledger_parsed is mapping and (wrapper_ledger_parsed.get('machines', none) is mapping)) }}"
  ansible.builtin.set_fact:
    wrapper_ledger: "{{ wrapper_ledger_parsed if wrapper_ledger_usable_calc else {'format': 1, 'machines': {}} }}"
    wrapper_ledger_usable: "{{ wrapper_ledger_usable_calc | bool }}"
  tags: [always]

- name: Warn when the ledger is unreadable
  ansible.builtin.debug:
    msg: >-
      WARNING: the ledger at {{ bind_mounts_state_dir }}/{{ ledger_file_name }}
      is unreadable or corrupt. Stale-element cleanup is disabled for this
      run: nothing playbook-managed will be removed. Fix or delete the
      ledger file to re-enable cleanup.
  when: not wrapper_ledger_usable
  tags: [always]
# The single vocabulary check is the shared gate filter (the legacy
# per-call known-set filter retired with the wrapper rewire); the run
# refuses every state token outside the frozen vocabulary, exactly the
# legacy scope: the configured machines plus the machines the ledger
# names.
- name: Fail on machine states this playbook does not understand
  ansible.builtin.set_fact:
    wrapper_state_gate: >-
      {{ smolvm_sections | smolvm_state_gate(
           (normalized | map(attribute='name') | list)
           + ((wrapper_ledger.machines | default({})) | dict2items | map(attribute='key') | list)) }}
  tags: [always]

- name: Fail on a state token outside the frozen vocabulary
  ansible.builtin.fail:
    msg: >-
      smolvm reports a state this run does not understand:
      {{ (wrapper_state_gate | dict2items
          | selectattr('value.classification', 'ne', 'running')
          | rejectattr('value.classification', 'eq', 'not-running')
          | map(attribute='value.message') | list | join(', ')) }}.
      Every lifecycle decision reads the machine state; anything outside
      the frozen vocabulary (running, stopped, created, failed,
      unreachable, frozen) cannot be decided safely. Bring the machine
      into a supported state before re-running.
  when: >-
    (wrapper_state_gate | dict2items
     | selectattr('value.classification', 'ne', 'running')
     | rejectattr('value.classification', 'eq', 'not-running')
     | list | length) > 0
  tags: [always]
