---
# One-off decommission entry point (transition footprint, created by the
# retirement gate and deleted by the gate's deletion commit). It composes
# the wrapper's artifact-removal tasks — the installed guest script, the
# sudoers drop-in, and the managed profile block, each presence-probed —
# because no current CLI selection removes artifacts while staying in bind
# mode. It runs OPERATOR-SUPERVISED against RUNNING machines, one machine
# at a time, sequenced after the role's verified runs on that machine.
#
# Scope: decommission ONLY. It performs no volume, bind, or ledger work —
# the profile play owns that. After this play runs on a machine, a clean
# login (no self-appointed guest mounts) and a verify-only profile run
# complete the per-machine gate evidence.
#
# Run from the repository root on the smolvm host, one machine at a time:
#   ansible-playbook playbooks/bind-mounts/decommission.yml -i inventory \
#     -e limit_machines=<machine> -K
- name: Decommission legacy bind-mounts guest artifacts
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true
  vars:
    # the play-level vars the composed wrapper task files assert against and
    # use: the artifact paths (verbatim from the wrapper play) and the
    # ledger state directory the registry plumbing checks for exclusivity
    installed_script_guest_path: /usr/local/sbin/bind-mount-on-guest.sh
    sudoers_dropin_guest_path: /etc/sudoers.d/010-bind-mounts
    sudoers_staging_guest_path: "/tmp/{{ sudoers_dropin_guest_path | basename }}"
    helper_dir_guest_path: /tmp/010-bind-mounts-helpers
    ledger_file_name: .bind-mounts-state.yml
    bind_mounts_state_dir: "{{ lookup('env', 'HOME') }}/.local/state/bind-mount-on-host-and-guest"
  tasks:
    # Registry plumbing, verbatim reuse of the wrapper's transition file:
    # it loads vars.yml, validates, and exposes the normalized machine list
    # (`normalized`), the smolvm inventory sections (`smolvm_sections`),
    # and the limit_machines scoping this play inherits from the same CLI.
    - name: Registry plumbing via the wrapper
      ansible.builtin.include_tasks: tasks/_wrapper_registry.yml
      tags: [always]

    - name: Decommission segment (probes and removals)
      ansible.builtin.include_tasks: tasks/_wrapper_artifacts.yml
      tags: [always]
