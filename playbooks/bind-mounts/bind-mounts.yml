---
# Managed install source for the smolvm host-directory sharing setup.
# Real machine names, users, and paths live in vars.yml (git-ignored).
# Run from the repository root on the smolvm host:
#   ansible-playbook playbooks/bind-mounts/bind-mounts.yml -i inventory -K          (default run)
#   ansible-playbook playbooks/bind-mounts/bind-mounts.yml -i inventory --tags attach -K   (volume convergence)
#   ansible-playbook playbooks/bind-mounts/bind-mounts.yml -i inventory --tags stop -K     (graceful stop)
#   ansible-playbook playbooks/bind-mounts/bind-mounts.yml -i inventory --tags teardown -K (undo playbook-created state)
# Only the default run and --tags attach converge a machine's volume set
# (teardown removes the volumes the ledger records); the partial tags
# (mounts, install, verify, start) refuse a pending change.
# Add -e limit_machines=name1[,name2...] to scope any run to those machines only.
# The one runner during the transition: the same CLI documented above,
# rewired over the capability role. Every wrapper task carries tags
# [always] and is gated on an `ansible_run_tags` intersection (reference
# table B), replicating the legacy per-tag selections; the role is
# invoked per segment through include_role with `bind_mounts_phase` set
# (the role's only interface; the role ignores tags entirely). The
# wrapper performs no ledger writes anywhere: the provenance
# ledger is the role's writer field from conversion onward. The play-level
# vars (legacy artifact paths and the state dir) stay exactly as they were
# so `-e` overrides keep working.
- name: Manage smolvm share bind mounts (host and guests)
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true
  vars:
    installed_script_guest_path: /usr/local/sbin/bind-mount-on-guest.sh
    sudoers_dropin_guest_path: /etc/sudoers.d/010-bind-mounts
    sudoers_staging_guest_path: "/tmp/{{ sudoers_dropin_guest_path | basename }}"
    # The guest helpers are staged here, root-owned, for the length of a run.
    # The directory sits on the guest's tmpfs /tmp, so a shutdown clears it,
    # and every use is preceded by a fresh copy.
    helper_dir_guest_path: /tmp/010-bind-mounts-helpers
    # The provenance ledger lives outside the share root, in the playbook
    # user's own state directory: no guest can see it, and every write runs
    # as the invoking user without become. lookup('env','HOME') follows the
    # invoking shell even when a task uses become; never spell the directory
    # as ~/... in a dest, where become would expand it to root's home.
    bind_mounts_state_dir: "{{ lookup('env', 'HOME') }}/.local/state/bind-mount-on-host-and-guest"
    ledger_file_name: .bind-mounts-state.yml
  tasks:
    # Registry plumbing (also builds the per-machine role registry, the
    # limit/force pass-through, the share-tree placeholders, the host mount
    # table and smolvm inventory reads, and the ledger read). Runs on every
    # selection, as the legacy always-tagged prelude did.
    - name: Registry plumbing via the wrapper
      ansible.builtin.include_tasks: tasks/_wrapper_registry.yml
      tags: [always]

    # Volume convergence: role attach invocation (default run and
    # --tags attach). An attach selection no longer
    # refuses when any machine is running; it refuses per machine and only
    # when that machine has a pending volume change - inside the role.
    # TAG MECHANISM (pinned, ansible-core 2.20): tags on a dynamic
    # include_role do NOT propagate into the role's tasks - the docs
    # (https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/include_role_module.html,
    # attributes row 'tags' and the 'apply' parameter) require apply: for
    # that. The wrapper therefore applies [always] at the include site: the
    # CLI-to-phase tag translation stays wrapper-owned (the when-gates are
    # the only selection mechanism) and the role
    # remains tag-free - its no-tags decision is untouched.
    - name: Attach phase via the capability role (volumes)
      ansible.builtin.include_role:
        name: bind_mounts
        apply:
          tags: [always]
      vars:
        bind_mounts_phase: attach
      when: ansible_run_tags | intersect(['all', 'attach']) | length > 0
      tags: [always]

    # Lifecycle segment: pending-change refusals (start/install
    # selections), start + exec-wait (default run and --tags start), and
    # the stop segment (--tags stop only).
    - name: Lifecycle segment via the wrapper (start/stop)
      ansible.builtin.include_tasks: tasks/_wrapper_lifecycle.yml
      when: ansible_run_tags | intersect(['all', 'start', 'install', 'stop']) | length > 0
      tags: [always]

    # Artifact segment, install half: default run and --tags install -
    # exactly as today: after start, before the guest binds.
    - name: Artifact segment via the wrapper (install/remove)
      ansible.builtin.include_tasks: tasks/_wrapper_artifacts.yml
      when: ansible_run_tags | intersect(['all', 'install']) | length > 0
      tags: [always]

    # Host + guest binds: role mounts invocation (default run and
    # --tags mounts). The host binds ride inside this post-start
    # invocation (only the host-bind work moved).
    - name: Mounts phase via the capability role (host and guest binds)
      ansible.builtin.include_role:
        name: bind_mounts
        apply:
          tags: [always]
      vars:
        bind_mounts_phase: mounts
      when: ansible_run_tags | intersect(['all', 'mounts']) | length > 0
      tags: [always]

    # Verification: role verify invocation (default run and --tags verify).
    - name: Verify phase via the capability role (read-only verification)
      ansible.builtin.include_role:
        name: bind_mounts
        apply:
          tags: [always]
      vars:
        bind_mounts_phase: verify
      when: ansible_run_tags | intersect(['all', 'verify']) | length > 0
      tags: [always]

    # Teardown: role teardown invocation first (host binds, subdirs,
    # recorded volumes, ledger prune), then the wrapper's artifact
    # removals, presence-probed (they key on the artifacts themselves).
    - name: Teardown phase via the capability role (host-side teardown)
      ansible.builtin.include_role:
        name: bind_mounts
        apply:
          tags: [always]
      vars:
        bind_mounts_phase: teardown
      when: ansible_run_tags | intersect(['teardown']) | length > 0
      tags: [always]

    - name: Artifact segment via the wrapper (removals after teardown)
      ansible.builtin.include_tasks: tasks/_wrapper_artifacts.yml
      when: ansible_run_tags | intersect(['teardown']) | length > 0
      tags: [always]
